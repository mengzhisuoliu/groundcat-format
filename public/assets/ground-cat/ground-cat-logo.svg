<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">走地猫</title>
  <desc id="desc">一只猫头、走地鸡身体、正在迈步的矢量吉祥物</desc>
  <defs>
    <linearGradient id="body" x1="145" y1="228" x2="382" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2DF"/>
      <stop offset="1" stop-color="#E9DCBB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#10140F" flood-opacity=".16"/>
    </filter>
  </defs>

  <g fill="none" stroke="#151914" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 379c70 31 217 36 296 0" stroke-width="18" opacity=".12"/>

    <g filter="url(#shadow)">
      <!-- walking legs -->
      <path d="M237 382c-3 30-16 48-43 60" stroke-width="22"/>
      <path d="M318 382c7 31 25 47 53 54" stroke-width="22"/>
      <path d="M166 446h49" stroke-width="22"/>
      <path d="M357 439h49" stroke-width="22"/>

      <!-- tail feathers -->
      <path d="M156 299c-43-42-82-43-105-20 34 1 50 15 62 38-32-8-57 3-68 24 39-5 66 9 91 37" fill="#3F62FF" stroke-width="18"/>

      <!-- chicken body -->
      <path d="M133 307c11-69 71-110 154-110 82 0 139 37 153 104 12 60-21 114-91 126-65 11-155 4-193-33-23-22-29-54-23-87Z" fill="url(#body)" stroke-width="18"/>
      <path d="M316 300c51 5 77 35 74 77-31 16-70 9-89-19-15-22-9-52 15-58Z" fill="#3F62FF" stroke-width="16"/>
      <path d="M317 320c-12 16-10 33 7 50" stroke-width="12"/>

      <!-- cat head and ears -->
      <path d="M171 202 154 99c-2-14 13-24 25-16l55 37c28-10 66-9 96 2l58-39c12-8 27 2 25 17l-18 105c13 25 14 53 1 76-20 37-66 56-112 55-49 0-96-20-115-59-11-23-10-51 2-75Z" fill="#242A24" stroke-width="18"/>
      <path d="m178 112 41 27-32 29Z" fill="#B95C50" stroke-width="10"/>
      <path d="m389 112-42 28 33 29Z" fill="#B95C50" stroke-width="10"/>

      <!-- cat face -->
      <path d="M219 219c10-11 23-11 34 0" stroke="#3F62FF" stroke-width="14"/>
      <path d="M315 219c10-11 23-11 34 0" stroke="#3F62FF" stroke-width="14"/>
      <path d="m273 248 13-8 13 8-13 13Z" fill="#B95C50" stroke-width="8"/>
      <path d="M286 261c-2 14-13 21-28 20m28-20c2 14 13 21 28 20" stroke="#F8F2DF" stroke-width="10"/>
      <path d="M201 253h-63m65 19-56 17m224-36h63m-65 19 56 17" stroke-width="10"/>

      <!-- small chicken comb, making the hybrid silhouette unmistakable -->
      <path d="M260 104c-8-22 9-42 30-31 10-24 43-15 40 11 25-7 39 21 20 38" fill="#B95C50" stroke-width="14"/>
    </g>
  </g>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe7">
    <title>走地猫 · 格式转换</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ground-cat/ground-cat-logo.svg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="brand-line">
            <strong class="brand-name" data-i18n="brand.name">走地猫</strong>
            <span class="app-version" id="appVersion"></span>
          </div>
          <p class="brand-subtitle" data-i18n="brand.subtitle">本地文件格式转换器</p>
        </div>
        <label class="language-field">
          <span class="sr-only" data-i18n="language.label">语言</span>
          <select id="languageSelect" aria-label="语言 / Language">
            <option value="zh-CN">中</option>
            <option value="en-US">EN</option>
          </select>
        </label>
      </header>

      <section class="converter" data-i18n-aria="workspace.aria" aria-label="文件转换工作台">
        <section class="upload-section" data-i18n-aria="upload.aria" aria-label="上传文件">
          <div class="section-label"><span>01</span><span data-i18n="workflow.select">选择文件</span></div>
          <input id="fileInput" type="file" class="sr-only" multiple>
          <button class="drop-zone" id="dropZone" type="button">
            <span class="upload-plus" aria-hidden="true"></span>
            <span class="drop-main" data-i18n="upload.title">选择文件</span>
            <span class="drop-sub" id="dropHint" data-i18n="upload.hint">也可以拖到这里</span>
          </button>

          <div class="file-strip" id="fileStrip" hidden>
            <div class="file-copy">
              <p class="file-name" id="fileName"></p>
              <p class="file-meta" id="fileMeta"></p>
            </div>
            <button class="text-button" id="clearButton" type="button" data-i18n="action.clear">清空</button>
          </div>
          <div class="batch-list" id="batchList" hidden></div>
        </section>

        <section class="output-section" data-i18n-aria="settings.aria" aria-label="转换设置">
          <div class="section-label"><span>02</span><span data-i18n="target.label">目标格式</span></div>

          <label class="field">
            <span class="sr-only" data-i18n="target.label">目标格式</span>
            <select id="targetSelect" disabled>
              <option value="" data-i18n="target.placeholder">先选择文件</option>
            </select>
          </label>
          <p class="format-hint" id="pdfExcelHint" data-i18n="pdfExcel.hint" hidden>适合电子版规则表格；扫描件、复杂表头和合并单元格可能不完整。</p>

          <label class="field" id="zipCompressionField" hidden>
            <span data-i18n="zip.label">ZIP 压缩级别</span>
            <select id="zipCompression">
              <option value="0" data-i18n="zip.0">0 不压缩（最快）</option>
              <option value="1" data-i18n="zip.1">1 最快</option>
              <option value="6" selected data-i18n="zip.6">6 标准（默认）</option>
              <option value="9" data-i18n="zip.9">9 最大压缩（最慢）</option>
            </select>
          </label>

          <label class="field" id="videoCodecField" hidden>
            <span data-i18n="videoCodec.label">视频编码</span>
            <select id="videoCodec">
              <option value="h264" selected data-i18n="videoCodec.h264">H.264（兼容性最好）</option>
              <option value="h265" data-i18n="videoCodec.h265">H.265（体积更小）</option>
              <option value="av1" data-i18n="videoCodec.av1">AV1（压缩率最高）</option>
            </select>
          </label>

          <label class="field" id="pdfPasswordField" hidden>
            <span data-i18n="pdfPassword.label">PDF 密码</span>
            <input id="pdfPassword" type="password" autocomplete="off">
          </label>
          <label class="field" id="pdfActionField" hidden>
            <span data-i18n="pdfAction.label">PDF 操作</span>
            <select id="pdfAction">
              <option value="" data-i18n="pdfAction.split">拆分 PDF（默认）</option>
              <option value="encrypt" data-i18n="pdfAction.encrypt">加密 PDF</option>
              <option value="decrypt" data-i18n="pdfAction.decrypt">解密 PDF</option>
            </select>
          </label>

          <div class="section-label action-label"><span>03</span><span data-i18n="action.convert">开始转换</span></div>
          <button class="primary-button" id="convertButton" type="button" disabled data-i18n="action.convert">开始转换</button>

          <div class="progress-panel" id="progressPanel" hidden>
            <div class="progress-header">
              <span id="progressLabel" data-i18n="progress.label">转换进度</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="progress.label" aria-label="转换进度">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="status-box" id="statusBox" role="status" data-i18n="status.ready"></div>
          <button class="reveal-button" id="openOutputButton" type="button" hidden data-i18n="action.reveal">打开所在文件夹 →</button>
          <a class="download-button" id="downloadButton" hidden data-i18n="action.download">保存文件</a>
          <button class="download-button" id="batchSaveButton" type="button" hidden data-i18n="action.saveAll">保存全部</button>
        </section>
      </section>
    </main>

    <script src="/i18n.js"></script>
    <script src="/conversion-preferences.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
